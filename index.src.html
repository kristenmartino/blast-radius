<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Blast Radius</title>
<style>
__SHELL_CSS__
__KIT_CSS__
/* Blast Radius additions */
.lanelist { display: grid; gap: 10px; }
.lanebtn { appearance: none; width: 100%; text-align: left; cursor: pointer; background: var(--sheet); color: var(--ink);
  border: 1px solid var(--rule); border-left: 6px solid var(--deck); border-radius: var(--r); padding: 12px 14px; display: grid; gap: 4px; min-height: 64px; }
.lanebtn:hover:not(:disabled) { border-color: var(--marker); border-left-color: var(--deck); }
.lanebtn:disabled { cursor: default; opacity: .6; border-left-style: dashed; }
.lanebtn .nm { font-weight: 700; font-size: 16px; line-height: 1.25; overflow-wrap: anywhere; }
.lanebtn .bl { color: var(--muted); font-size: 14px; line-height: 1.35; }
.lanebtn .st { font-family: var(--f-mono); font-size: 12px; color: var(--marker); font-weight: 600; }
.lanebtn:disabled .st { color: var(--muted); }
.lvchips { display: inline-flex; flex-wrap: wrap; gap: 4px; }
.lvchip { font-family: var(--f-mono); font-size: 11.5px; padding: 2px 7px; border-radius: 999px; background: var(--sunk); color: var(--muted); }
.secrow { display: grid; gap: 4px; padding: 12px 0; border-bottom: 1px solid var(--rule); }
.secrow:last-child { border-bottom: 0; }
.secrow .top { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; justify-content: space-between; }
.secrow b { font-size: 16px; overflow-wrap: anywhere; }
.secrow .k { font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.soon { font-family: var(--f-mono); font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--warn-soft); color: var(--warn); }
.roles { display: flex; flex-wrap: wrap; gap: 6px; }
.items { display: grid; gap: 8px; margin-top: 6px; }
.itemrow { display: grid; gap: 4px; padding: 10px 12px; border: 1px solid var(--rule); border-radius: 10px; background: var(--board); color: var(--ink); text-decoration: none; min-height: 44px; }
.itemrow:hover { border-color: var(--marker); }
.itemrow .top { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: baseline; justify-content: space-between; }
.itemrow b { font-size: 15.5px; overflow-wrap: anywhere; }
.itemrow .k { font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.prose p { font-size: 16px; line-height: 1.55; }
.stem { font-size: 17px; font-weight: 600; line-height: 1.4; }
.foot { color: var(--muted); font-size: 13px; display: grid; gap: 6px; }
</style>
</head>
<body>
<div id="app"></div>
<script>const BANK = __BANK__;</script>
<script>__STUDY_KIT__</script>
<script>
(function () {
  'use strict';
  const K = window.StudyKit, app = document.getElementById('app');
  const APP = 'blast-radius';
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', '\'': '&#39;' }[c]));
  const X = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>';
  const LANES = BANK.lanes, LEVELS = BANK.levels, SECTIONS = BANK.sections;
  const laneById = id => LANES.find(l => l.id === id);
  let SCREEN = 'home', VIEW = {}, SAMPLE = null;

  // ---- preferences (level filter, last lane): one small document, data/users/<uid>/prefs, saved with study-kit's store
  const PREF_KEYS = ['levels', 'lane'];
  const prefs = K.save.createStore({
    localKey: APP + ':prefs:v1', doc: 'prefs', field: 'prefs',
    normalize(x) { const o = {}; if (!x || typeof x !== 'object') return o; for (const k of PREF_KEYS) if (x[k] && typeof x[k] === 'object' && typeof x[k].ts === 'number') o[k] = { ts: x[k].ts, v: x[k].v }; return o; },
    onRemote() { if (SCREEN === 'home' || SCREEN === 'lane') host.keepScroll(); },
    onStatus() { const el = document.getElementById('prefs-saved'); if (el) el.textContent = prefs.statusText(); }
  });
  prefs.loadLocal();
  const ALL = LEVELS.map(l => l.id);
  function levels() { const p = prefs.get('levels'); const v = p && Array.isArray(p.v) ? p.v.filter(x => ALL.indexOf(x) !== -1) : []; return v.length ? v : ALL.slice(); }
  function setLevels(v) { prefs.put('levels', { ts: Date.now(), v }); }

  // ---- theme (this device only)
  const THEME_KEY = APP + ':theme';
  function theme() { try { return localStorage.getItem(THEME_KEY) || 'system'; } catch (e) { return 'system'; } }
  function applyTheme(t) { if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); else document.documentElement.removeAttribute('data-theme'); }
  applyTheme(theme());

  const host = {
    esc,
    screen: () => SCREEN,
    view: () => VIEW,
    go(screen, view) { SCREEN = screen; VIEW = view || {}; render(); window.scrollTo(0, 0); },
    render: () => render(),
    keepScroll() { const y = window.scrollY; render(); window.scrollTo(0, y); },
    paint(html) { app.innerHTML = html; },
    header: (title, act, id, label, meta) => '<div class="playtop"><div class="wrap"><button class="iconbtn" data-act="' + act + '"' + (id ? ' data-id="' + esc(id) + '"' : '') + ' aria-label="' + esc(label) + '">' + X + '</button><h1 class="ttl">' + esc(title) + '</h1><span class="meta">' + esc(meta || '') + '</span></div></div>',
    listHeader: title => '<div class="playtop"><div class="wrap"><button class="iconbtn" data-act="home" aria-label="Back to start">' + X + '</button><h1 class="ttl">' + esc(title) + '</h1><span class="meta"></span></div></div>',
    sampler: () => SAMPLE,
    samplerGone() { SAMPLE = null; },
    toast(msg) { const t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 2600); },
    confirm(title, body, ok, cb) { if (window.confirm(title + '\n\n' + body)) cb(); },
    copy(text, msg) { try { navigator.clipboard.writeText(text).then(() => host.toast(msg), () => host.toast(text)); } catch (e) { host.toast(text); } },
    linkBase: '',
    lessonTitle: () => null,
    fmtDate: ts => { try { return new Date(ts).toLocaleDateString(undefined, { month: 'short', day: 'numeric' }); } catch (e) { return ''; } },
    icon: { ok: '✓', bad: '✗' }
  };

  // Engines: role-play rules and scoring options all on, as in Inspect & Adapt V34.
  const craft = K.craft.create({ packets: BANK.craft, appKey: APP, keyStyle: 'slug', domain: 'technology leadership', factsSubject: 'business, systems, vendors or people', host });
  const sims = K.sims.create({ runs: BANK.runs, roleplays: BANK.roleplays, appKey: APP, runNoun: 'Simulation', rpHeading: 'Role-plays', host,
    roleplay: { learner: 'CIO', rules: ['guarded', 'noCoaching', 'noUnpromptedOffer'], scoring: ['outcomeAgreesWithScore', 'verifiedQuotes'] } });

  const lvChips = ids => '<span class="lvchips">' + ids.map(id => '<span class="lvchip">' + esc((LEVELS.find(l => l.id === id) || {}).name || id) + '</span>').join('') + '</span>';
  function levelFilter() {
    const on = levels();
    return '<section aria-labelledby="lv-h"><div class="section-h"><h2 id="lv-h">Level</h2><span class="hint">Shows content tagged for the levels you pick</span></div>' +
      '<div class="toggles" role="group" aria-label="Level filter">' + LEVELS.map(l => '<button class="tog" data-act="level" data-id="' + l.id + '" aria-pressed="' + (on.indexOf(l.id) !== -1) + '" title="' + esc(l.scope) + '">' + esc(l.name) + '</button>').join('') + '</div>' +
      '<p class="note" style="margin-top:8px">' + LEVELS.filter(l => on.indexOf(l.id) !== -1).map(l => '<b>' + esc(l.name) + '</b>: ' + esc(l.scope).toLowerCase()).join('. ') + '.</p></section>';
  }
  function renderHome() {
    const last = prefs.get('lane');
    app.innerHTML = '<header class="mast"><div class="wrap"><div class="brand">Blast Radius</div><p class="sub">Technology leadership: the executive layer, by role and level.</p>' +
      '<div class="pills"><span class="pill">study-kit <b>' + esc(BANK.kitVersion) + '</b></span><span class="pill" id="prefs-saved">' + esc(prefs.statusText()) + '</span></div></div></header>' +
      '<main class="wrap">' + levelFilter() +
      '<section aria-labelledby="ln-h"><div class="section-h"><h2 id="ln-h">Lanes</h2><span class="hint">CIO first; the rest follow in build order</span></div><div class="lanelist">' +
      LANES.map(l => '<button class="lanebtn" style="--deck:var(' + l.color + ')" data-act="lane" data-id="' + l.id + '"' + (l.active ? '' : ' disabled aria-disabled="true"') + '>' +
        '<span class="nm">' + esc(l.name) + '</span><span class="bl">' + esc(l.blurb) + '</span>' +
        '<span class="st">' + (l.active ? (last && last.v === l.id ? 'Open · last visited' : 'Open') : 'Later') + '</span></button>').join('') +
      '</div></section>' + foot() + '</main>';
  }
  const OM = BANK.opmodel, PROMPTS = BANK.prompts;
  const showFor = item => { const on = levels(); return (item.levels || ALL).some(v => on.indexOf(v) !== -1); };
  const levelName = id => (LEVELS.find(l => l.id === id) || {}).name || id;
  const draftChip = item => item && item.status === 'Draft' ? '<span class="cchip draft">Draft</span>' : '';
  const hidden = n => n ? '<p class="note">' + n + ' more hidden by the level filter.</p>' : '';
  function itemRow(href, title, meta, lv, status) {
    return '<a class="itemrow" href="' + esc(href) + '"><span class="top"><b>' + esc(title) + '</b>' + draftChip({ status }) + '</span>' +
      (meta ? '<span class="k">' + esc(meta) + '</span>' : '') + lvChips(lv) + '</a>';
  }
  // What each built section lists. Unbuilt sections show their phase.
  const SECTION_ITEMS = {
    'operating-model': () => { const ls = OM.lessons.filter(showFor); return ls.map(l => itemRow('#lesson-' + l.id, l.title, 'Lesson · ' + OM.checks.filter(c => c.lesson === l.id).length + ' checks', l.levels, l.status)).join('') + hidden(OM.lessons.length - ls.length); },
    'portfolio-cases': () => { const ps = BANK.craft.filter(p => p.lane === 'cio' && showFor(p)); return ps.map(p => itemRow('#packet-' + p.id.toLowerCase(), p.title, 'Craft packet · ' + p.stages.length + ' stages · you are the ' + p.role, p.levels, p.status)).join('') + hidden(BANK.craft.filter(p => p.lane === 'cio').length - ps.length); },
    'renewal-sim': () => { const rs = BANK.runs.filter(r => r.lane === 'cio' && showFor(r)); return rs.map(r => itemRow('#run-' + r.id.toLowerCase(), r.title, 'Simulation · ' + r.steps.length + ' steps · numbers computed in code', r.levels, r.status)).join('') + hidden(BANK.runs.filter(r => r.lane === 'cio').length - rs.length); },
    'behavioral': () => { const n = PROMPTS.filter(showFor).length; return itemRow('#prompts-cio', 'CIO-family behavioral prompts', n + ' of ' + PROMPTS.length + ' at your levels · mapped to the Master Story Bank', ALL, PROMPTS.some(p => p.status === 'Draft') ? 'Draft' : ''); }
  };
  function renderLane() {
    const l = laneById(VIEW.id);
    if (!l || !l.active) return host.go('home', {});
    const on = levels(), secs = SECTIONS[l.id] || [];
    app.innerHTML = host.header(l.short + ' lane', 'home', '', 'Back to lanes', on.length === ALL.length ? 'All levels' : on.map(levelName).join(' · ')) +
      '<main class="wrap"><section class="card" style="display:grid;gap:10px"><h2 class="ttl" style="font-size:19px">' + esc(l.name) + '</h2><p class="note">' + esc(l.blurb) + '</p>' +
      (l.roles ? '<div class="roles" aria-label="Role titles">' + l.roles.map(r => '<span class="pill">' + esc(r) + '</span>').join('') + '</div>' : '') + '</section>' +
      levelFilter() +
      '<section aria-labelledby="sc-h"><div class="section-h"><h2 id="sc-h">Sections</h2><span class="hint">Draft items are not yet reviewed</span></div><div class="card" style="padding-block:4px">' +
      secs.map(s => { const fn = SECTION_ITEMS[s.id];
        return '<div class="secrow" id="' + esc(l.id + '-' + s.id) + '"><div class="top"><b>' + esc(s.title) + '</b>' + (fn ? '<span class="k">' + esc(s.kind) + '</span>' : '<span class="soon">Phase ' + s.phase + '</span>') + '</div>' +
          (fn ? '<div class="items">' + fn() + '</div>' : '<span class="k">' + esc(s.kind) + ' · not built yet</span>') + '</div>'; }).join('') +
      '</div></section>' + foot() + '</main>';
  }
  // Operating model lesson with its two checks. Answers are kept for this visit only.
  const PICKS = {};
  function renderLesson() {
    const l = OM.lessons.find(x => x.id === VIEW.id);
    if (!l) return host.go('lane', { id: 'cio' });
    const i = OM.lessons.indexOf(l), next = OM.lessons[i + 1];
    const checks = OM.checks.filter(c => c.lesson === l.id);
    app.innerHTML = host.header('Operating model', 'lane', 'cio', 'Back to the CIO lane', (i + 1) + ' of ' + OM.lessons.length) +
      '<main class="wrap"><article class="card prose" style="display:grid;gap:12px"><div class="row">' + draftChip(l) + lvChips(l.levels) + '</div><h2 class="ttl" style="font-size:20px">' + esc(l.title) + '</h2>' +
      l.body.map(p => '<p>' + esc(p) + '</p>').join('') +
      (l.sources.length ? '<h3 class="k">Sources</h3><ul class="src">' + l.sources.map(s => '<li><a href="' + esc(s[1]) + '" target="_blank" rel="noopener">' + esc(s[0]) + '</a> <span class="lvchip">' + esc(s[2]) + '</span></li>').join('') + '</ul>' : '<p class="note">No single source: tagged Inferred.</p>') +
      '</article>' +
      checks.map(c => { const pick = PICKS[c.id], done = pick !== undefined;
        return '<section class="card" style="display:grid;gap:10px" id="check-' + esc(c.id.toLowerCase()) + '"><div class="row"><span class="qid">' + esc(c.id) + '</span>' + lvChips(c.levels) + '</div><p class="stem">' + esc(c.stem) + '</p><div class="opts">' +
          c.options.map((o, j) => { const cls = !done ? '' : j === c.answer ? ' is-correct' : j === pick ? ' is-wrong' : '';
            return '<button class="opt' + cls + '" data-act="check-pick" data-id="' + esc(c.id) + '" data-j="' + j + '"' + (done ? ' disabled' : '') + ' aria-pressed="' + (pick === j) + '"><span class="key">' + 'ABCD'[j] + '</span><span>' + esc(o) +
              (done && j === c.answer ? '<span class="tag">Answer</span>' : done && j === pick ? '<span class="tag">Your pick</span>' : '') + '</span></button>'; }).join('') + '</div>' +
          (done ? '<p class="verdict ' + (pick === c.answer ? 'ok' : 'bad') + '">' + (pick === c.answer ? 'Right' : 'Not quite') + '</p><p>' + esc(c.why) + '</p>' + (pick !== c.answer ? '<p class="note">' + esc(c.whyNot[pick]) + '</p>' : '') : '') + '</section>'; }).join('') +
      '<div class="row">' + (next ? '<a class="btn btn-primary" href="#lesson-' + esc(next.id) + '">Next: ' + esc(next.title) + '</a>' : '') + '<a class="btn" href="#lane-cio">Back to the CIO lane</a></div>' + foot() + '</main>';
  }
  function renderPrompts() {
    const ps = PROMPTS.filter(showFor);
    app.innerHTML = host.header('Behavioral prompts', 'lane', 'cio', 'Back to the CIO lane', ps.length + ' of ' + PROMPTS.length) +
      '<main class="wrap"><p class="note">Practise each prompt aloud with the stories listed. Story links open your Master Story Bank (copy of ' + esc(BANK.storyBankVersion) + '); this app only reads it.</p>' +
      ps.map(p => '<section class="card" style="display:grid;gap:8px" id="prompt-' + esc(p.id.toLowerCase()) + '"><div class="row"><span class="qid">' + esc(p.id) + '</span>' + draftChip(p) + lvChips(p.levels) + '</div>' +
        '<p class="stem">' + esc(p.prompt) + '</p><div class="roles">' + p.roles.map(r => '<span class="pill">' + esc(r) + '</span>').join('') + '</div>' +
        '<p><b>Tests:</b> ' + esc(p.tests) + '</p><p class="note"><b>By level:</b> ' + esc(p.level) + '</p>' +
        '<ul class="src">' + p.stories.map(st => '<li><a href="' + esc(st.url) + '" target="_blank" rel="noopener">' + esc(st.ref + ': ' + st.title) + '</a></li>').join('') + '</ul></section>').join('') +
      hidden(PROMPTS.length - ps.length) + levelFilter() + foot() + '</main>';
  }
  function foot() {
    const t = theme();
    return '<footer class="foot"><div class="row"><span>Theme:</span>' + ['system', 'light', 'dark'].map(x => '<button class="tog" data-act="theme" data-id="' + x + '" aria-pressed="' + (t === x) + '">' + x[0].toUpperCase() + x.slice(1) + '</button>').join('') + '</div>' +
      '<p>Engines: study-kit ' + esc(BANK.kitVersion) + '. Claude grading and role-plays work when this page is open in Claude; everything else works without it.</p></footer>';
  }

  const SCREENS = Object.assign({ home: renderHome, lane: renderLane, lesson: renderLesson, prompts: renderPrompts }, craft.screens, sims.screens);
  const ACT = Object.assign({
    home() { history.replaceState(null, '', location.pathname + location.search); host.go('home', {}); },
    'check-pick'(t) { const id = t.dataset.id; if (PICKS[id] !== undefined) return; PICKS[id] = +t.dataset.j; host.keepScroll(); },
    lane(t) { const l = laneById(t.dataset.id); if (!l || !l.active) return; prefs.put('lane', { ts: Date.now(), v: l.id }); history.replaceState(null, '', '#lane-' + l.id); host.go('lane', { id: l.id }); },
    level(t) { const id = t.dataset.id, on = levels(), i = on.indexOf(id); if (i === -1) on.push(id); else if (on.length > 1) on.splice(i, 1); else return host.toast('Keep at least one level on.'); setLevels(ALL.filter(x => on.indexOf(x) !== -1)); host.keepScroll(); },
    theme(t) { try { localStorage.setItem(THEME_KEY, t.dataset.id); } catch (e) { /* storage unavailable */ } applyTheme(t.dataset.id); host.keepScroll(); }
  }, craft.actions, sims.actions);
  function render() { (SCREENS[SCREEN] || renderHome)(); }

  // Routes: dash form only (#lane-cio). Craft and Simulations route their own (#stage-br-1-1, #run-brn-1).
  function route(h) {
    let lm = /^#lesson-(om-\d+)$/.exec(h || '');
    if (lm && OM.lessons.some(l => l.id === lm[1])) { host.go('lesson', { id: lm[1] }); return true; }
    if (h === '#prompts-cio') { host.go('prompts', {}); return true; }
    const m = /^#lane-([a-z0-9-]+)$/.exec(h || '');
    if (m) { const l = laneById(m[1]); if (l && l.active) { host.go('lane', { id: l.id }); return true; } host.go('home', {}); return true; }
    return craft.route(h) || sims.route(h);
  }
  document.addEventListener('click', e => { const t = e.target.closest('[data-act]'); if (!t || t.disabled) return; const fn = ACT[t.dataset.act]; if (fn) fn(t, e); });
  document.addEventListener('input', e => { craft.onInput(e) || sims.onInput(e); });
  document.addEventListener('toggle', e => { craft.onToggle(e); }, true);
  window.addEventListener('pagehide', () => craft.onPageHide());
  window.addEventListener('hashchange', () => route(location.hash));

  craft.start(); sims.start();
  if (!(location.hash && route(location.hash))) render();

  // Claude capabilities: sample (grading, role-plays), db and user (saving to the account).
  (async () => {
    const C = window.claude;
    if (!C || typeof C.use !== 'function') return;
    try { const fn = await C.use('sample'); if (typeof fn === 'function') { SAMPLE = fn; if (SCREEN !== 'home' && SCREEN !== 'lane') host.keepScroll(); } } catch (e) { /* not granted */ }
    try {
      const db = await C.use('db'), user = await C.use('user'), uid = user && await user.id();
      if (db && uid) { prefs.attach(db, uid); craft.attach(db, uid); sims.attach(db, uid); if (SCREEN === 'home') host.keepScroll(); }
    } catch (e) { /* saved on this device only */ }
  })();
  window.__br = { craft, sims, prefs, host };
})();
</script>
</body>
</html>
